name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # tests/test_bend_model.py needs the Bend compiler; the bend-proofs job runs it.
      - run: uv run pytest -q --ignore=tests/test_bend_model.py

  bend-proofs:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: "1"
      BEND_VERSION: "2.0.40"
      # sha256 of bend-2.0.40-linux-x64.tar.gz, as pinned by the release's own install.sh
      BEND_SHA256: "c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Bend (pinned release, sha256 checked)
        run: |
          set -euo pipefail
          name="bend-${BEND_VERSION}-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$name" \
            "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/$name"
          echo "${BEND_SHA256}  $RUNNER_TEMP/$name" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.bend/bin"
          mv "$RUNNER_TEMP/bend/bend2" "$RUNNER_TEMP/bend/guide" "$HOME/.bend/"
          mv "$RUNNER_TEMP/bend/bin/bend" "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          bend version
          clang --version
      - name: No escape hatches in the proofs
        run: |
          if grep -rnE '@unsafe|def [A-Za-z0-9_.]+\?\(|\?[A-Za-z]' proofs --include='*.bend' | grep -vE '^[^:]+:[0-9]+:\s*#'; then
            echo "proofs/ must not use @unsafe, def f?(..) or ?holes" >&2
            exit 1
          fi
      - name: Check the proofs
        run: bend proofs/PROOF.bend
      - run: uv sync
      - name: Model against the Python code
        run: uv run pytest -q tests/test_bend_model.py
