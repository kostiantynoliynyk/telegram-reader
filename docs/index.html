<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How telegram-reader answers a logged-in user · read-only MCP server · one tool call, step by step</title>
<style>:root {
  --bg: #070b18; --ink: #e9edff; --mut: #8f9ac6; --dim: #5d688f; --line: rgba(125, 140, 230, .22);
  --acc: #6b7bff; --good: #2ecc71; --bad: #ff5d5d; --run: #ff9f43; --cyan: #2ee6d6; --gold: #f1c40f;
  --glass: rgba(12, 16, 36, .74); --sidew: 372px; --lensw: 318px;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; outline: none; }
#vig { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(2, 4, 12, .62) 100%); }
#leaders { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
#leaders path { stroke: rgba(150, 165, 255, .5); stroke-width: 1.2; stroke-dasharray: 3 5; animation: dash 1.6s linear infinite; }
#leaders circle { fill: #aab6ff; stroke: none; }
@keyframes dash { to { stroke-dashoffset: -16; } }
#labels { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 3; }

/* ---------- labels that follow the 3D things ---------- */
.lbl { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; display: flex; flex-direction: column; align-items: center; gap: 3px; white-space: nowrap; will-change: transform, opacity; }
.lbl.node { display: grid; grid-template-columns: auto auto; justify-content: center; justify-items: center; align-items: center; gap: 3px 4px; pointer-events: auto; cursor: pointer; }
.lbl.node .own { grid-row: 1; grid-column: 1 / -1; display: none; font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 6px; }
#labels.own .lbl.node .own:not(:empty) { display: block; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
.lbl .own[data-who=no] { color: var(--mut); background: rgba(8, 11, 26, .82); border: 1px dashed var(--line); font-weight: 500; }
.lbl.node .note { grid-row: 2; grid-column: 1 / -1; }
.lbl.node .tag.rel { grid-row: 3; grid-column: 1 / -1; }
.lbl.node .name { grid-row: 4; grid-column: 1; }
.lbl.node .tag.ver { grid-row: 4; grid-column: 2; }
.lbl .name { display: flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 999px; font-weight: 600; font-size: 12.5px; letter-spacing: .1px;
  background: rgba(8, 11, 26, .78); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 2px 10px rgba(0, 0, 0, .45); }
.lbl .name svg { width: 13px; height: 13px; color: var(--c); flex: none; }
.lbl.ghost .name { border-style: dashed; color: var(--mut); background: rgba(8, 11, 26, .5); }
.lbl.off .name { color: var(--dim); }
.lbl .note, .lbl .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: rgba(8, 11, 26, .82); border: 1px solid var(--line); }
.lbl .note:empty, .lbl .tag:empty { display: none; }
.lbl .note { color: #ffd9a8; border-color: rgba(255, 159, 67, .5); font-weight: 600; }
.lbl .note.muted { color: var(--dim); border-style: dashed; border-color: var(--line); font-weight: 400; font-style: italic; }
.lbl .tag.ver { font-family: var(--mono); font-size: 11.5px; }
.lbl .tag.ver { color: #c3ccf2; }
.lbl .tag.ver[data-k=new], .lbl .tag.ver[data-k=good] { color: #8ff0b6; border-color: rgba(46, 204, 113, .6); background: rgba(10, 40, 24, .85); }
.lbl .tag.ver[data-k=none] { color: var(--mut); border-style: dashed; }
.lbl .tag.ver[data-k=bad] { color: #ffb3b3; border-color: rgba(255, 93, 93, .65); background: rgba(48, 12, 16, .85); }
.lbl .tag.ver[data-k=warn] { color: #ffd9a8; border-color: rgba(255, 159, 67, .6); background: rgba(46, 26, 6, .85); }
.lbl .tag.rel { font-weight: 700; font-size: 11.5px; padding: 2px 10px; color: #dbe1ff; border-color: rgba(125, 140, 230, .6); }
.lbl .tag.rel[data-k=new], .lbl .tag.rel[data-k=good] { color: #06210f; background: #43e088; border-color: #43e088; }
.lbl .tag.rel[data-k=bad] { color: #2a0606; background: #ff7b7b; border-color: #ff7b7b; }
.lbl .tag.rel[data-k=warn] { color: #2a1600; background: #ffb357; border-color: #ffb357; }
.lbl .tag.rel[data-k=none] { color: var(--mut); border-style: dashed; font-weight: 500; }
.lbl .pop { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { 0% { transform: scale(.6); filter: brightness(2.2); } 100% { transform: none; filter: none; } }
.lbl.pkt { flex-direction: row; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: var(--c);
  background: rgba(6, 9, 22, .86); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 30%, transparent); }
.lbl.pkt svg { width: 11px; height: 11px; }

/* ---------- shared ---------- */
.card { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: 0 14px 44px rgba(0, 0, 0, .46), inset 0 1px 0 rgba(255, 255, 255, .04);
  -webkit-backdrop-filter: blur(14px) saturate(1.25); backdrop-filter: blur(14px) saturate(1.25); }
.ttl { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--mut); margin-bottom: 8px; }
.ttl svg { width: 13px; height: 13px; }
.x { margin-left: auto; cursor: pointer; font-size: 17px; line-height: 1; color: var(--mut); padding: 0 4px; border-radius: 6px; }
.x:hover { color: var(--ink); background: rgba(255, 255, 255, .08); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.badge.old { color: #dbe1ff; background: rgba(107, 123, 255, .2); border-color: rgba(125, 140, 230, .5); }
.badge.new, .badge.good { color: #06210f; background: #43e088; }
.badge.bad { color: #2a0606; background: #ff7b7b; }
.badge.warn { color: #2a1600; background: #ffb357; }
.badge.none { color: var(--dim); border: 1px dashed var(--line); }
.good { color: var(--good); } .bad { color: var(--bad); } .run, .warn { color: var(--run); }
.src { margin-top: 5px; font: 10.5px var(--mono); color: var(--dim); word-break: break-all; }
.src::before { content: "\2192  "; }

/* ---------- top bar ---------- */
#top { position: fixed; z-index: 6; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  background: linear-gradient(rgba(7, 11, 24, .92), rgba(7, 11, 24, 0)); }
#brand { font-weight: 700; font-size: 14px; letter-spacing: .2px; white-space: nowrap; margin-right: 4px; flex: none; }
#brand small { display: block; font-weight: 500; font-size: 10.5px; color: var(--mut); letter-spacing: .3px; }
#tabs { display: flex; align-items: center; gap: 5px; flex-wrap: nowrap; min-width: 0; flex: 1 1 auto; }
#top.fit1 .tool span { display: none; }
#top.fit2 .grp { margin-left: 6px; font-size: 0; } #top.fit2 .grp::before { content: "·"; font-size: 12px; }
#top.fit2 #brand small { display: none; }
#top.fit3 #brand { display: none; } #top.fit3 .tab { padding: 5px 8px; font-size: 12px; }
#top.fit4 #tabs { overflow-x: auto; scrollbar-width: none; padding: 8px 2px; } #top.fit4 #tabs::-webkit-scrollbar { display: none; }
.grp { font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); margin: 0 2px 0 12px; white-space: nowrap; }
.tab { padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: #b9c2ea; border: 1px solid var(--line); background: rgba(12, 16, 36, .6); white-space: nowrap; transition: .15s; }
.tab:hover { color: #fff; border-color: rgba(150, 165, 255, .6); }
.tab.on { color: #fff; background: linear-gradient(180deg, #7686ff, #5565f0); border-color: #8a98ff; box-shadow: 0 0 18px rgba(107, 123, 255, .55); }
#tools { margin-left: auto; display: flex; gap: 5px; flex: none; }
.tool { display: flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 9px; font-size: 11.5px; font-weight: 600; color: var(--mut); border: 1px solid var(--line); background: rgba(12, 16, 36, .6); white-space: nowrap; }
.tool svg { width: 13px; height: 13px; }
.tool:hover { color: #fff; }
.tool.on { color: #dfe5ff; border-color: rgba(138, 152, 255, .75); background: rgba(107, 123, 255, .22); }

/* ---------- lens cards: small live views next to the picture (what a person sees, what is stored, ...) ---------- */
.lens { position: fixed; z-index: 5; top: 62px; width: var(--lensw); padding: 10px 12px 12px; }
#lens0 { left: 16px; }
#lens1 { left: calc(16px + var(--lensw) + 12px); }
.lens-body { position: relative; font-size: 12px; }
.lens-body.frame { min-height: 150px; border-radius: 10px; padding: 9px 10px; background: rgba(4, 6, 16, .72); border: 1px solid rgba(125, 140, 230, .16); }
.lens.has-dlg .lens-body { overflow: hidden; border-radius: 10px; }
.blk + .blk { margin-top: 8px; }
.blk.t-head + .blk, .blk.t-field + .blk.t-field { margin-top: 4px; }
.b-h { display: flex; align-items: center; gap: 7px; }
.b-h b { font-size: 13.5px; }
.b-sub { color: var(--mut); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-on { margin-left: auto; flex: none; font-size: 11px; display: flex; align-items: center; gap: 4px; color: #8ff0b6; }
.b-on::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.b-on.bad { color: #ff9c9c; } .b-on.warn, .b-on.run { color: #ffcf9a; } .b-on.off, .b-on.dim { color: var(--dim); }
.b-h .b-f { margin-left: auto; flex: none; font-size: 10.5px; color: var(--mut); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.b-h .b-f + .b-f, .b-h .b-on + .b-f { margin-left: 0; }
.b-kv { display: flex; align-items: center; gap: 8px; padding: 0 2px; color: var(--mut); }
.b-kv b { color: var(--ink); font-weight: 600; }
.b-kv b.mono { font-family: var(--mono); font-size: 11.5px; }
.b-kv b.ok { color: #8ff0b6; } .b-kv b.hot { color: #ffb3b3; } .b-kv b.dim { color: var(--dim); font-weight: 400; }
.b-tn { display: flex; align-items: baseline; gap: 8px; font-family: var(--mono); font-size: 11.5px; font-weight: 700; color: #9aa6ff; margin-bottom: 4px; }
.b-tn em { margin-left: auto; font: 500 10.5px var(--sans); color: var(--dim); font-style: normal; white-space: nowrap; }
.b-empty { padding: 3px 8px; color: var(--dim); font-style: italic; font-size: 11.5px; }
.b-t { width: 100%; border-collapse: separate; border-spacing: 0 2px; font-size: 11.5px; }
.b-t td { padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 132px; background: rgba(4, 6, 16, .55); }
.lens-body.frame .b-t td { background: none; }
.b-t td:first-child { border-radius: 6px 0 0 6px; font-weight: 600; }
.b-t td:last-child { border-radius: 0 6px 6px 0; }
.b-t.wide td { padding: 3px 3px; } .b-t.wide td:first-child { padding-left: 6px; } .b-t.wide td.mono { font-size: 10.5px; }
.b-t td.mono { font-family: var(--mono); font-size: 11px; color: #c3ccf2; font-weight: 400; }
.b-t td.dim { color: var(--dim); font-weight: 400; }
.b-t td.hot { color: #ffb3b3; font-weight: 700; }
.b-t td.ok { color: #8ff0b6; font-weight: 700; }
.b-t td.fresh, .b-t td.num { font-family: var(--mono); text-align: right; }
.b-t td .badge { font-size: 10.5px; padding: 1px 6px; }
.b-t tr.hd td { background: none; font-size: 9.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--dim); padding-top: 0; padding-bottom: 0; }
.b-t tr.me td { background: rgba(107, 123, 255, .16); }
.b-t tr.dim td { opacity: .45; }
.b-t tr.hot td { background: rgba(255, 93, 93, .14); color: #ffc4c4; }
.b-t tr.good td { background: rgba(46, 204, 113, .12); }
.b-t tr.fresh td { animation: rowok 1.6s ease-out; }
.b-t tr.fresh.hot td { animation: rowbad 1.6s ease-out; }
@keyframes rowok { 0% { background: rgba(46, 204, 113, .5); } }
@keyframes rowbad { 0% { background: rgba(255, 93, 93, .55); } }
.b-log { overflow: hidden auto; border-radius: 8px; background: rgba(4, 6, 16, .6); padding: 3px 0; scrollbar-width: thin; scrollbar-color: #2b3566 transparent; }
.b-ev { display: flex; gap: 6px; padding: 1.5px 8px; font-family: var(--mono); font-size: 10.5px; line-height: 16px; color: #aab3d9; }
.b-ev span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-ev span:first-child { flex: none; width: 52px; color: var(--dim); }
.b-ev span:first-child:empty { display: none; }
.b-ev span:nth-child(2) { flex: 0 1 auto; color: #dfe5ff; }
.b-ev span:last-child { flex: 1 1 0; min-width: 0; text-align: right; color: var(--dim); }
.b-ev.bad span:nth-child(2) { color: #ff9c9c; }
.b-ev.good span:nth-child(2) { color: #8ff0b6; }
.b-ev.warn span:nth-child(2) { color: #ffcf9a; }
.b-ev.last { background: rgba(107, 123, 255, .16); }
.b-ev.fresh { animation: rowok 1.4s ease-out; }
.b-rec { padding: 6px 8px; border-radius: 8px; background: rgba(4, 6, 16, .6); border: 1px solid var(--line); }
.b-rec > div:first-child { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.b-rec b { font-family: var(--mono); color: #9aa6ff; flex: none; }
.b-rec > div:first-child > span:not(.st) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-rec .st { margin-left: auto; flex: none; font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.b-m { margin-top: 3px; font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
.b-btn { display: inline-block; margin-left: 2px; padding: 4px 14px; border-radius: 8px; font-weight: 700; color: #cfd6ff; border: 1px solid var(--line); }
.b-btn.primary { color: #fff; border-color: transparent; background: linear-gradient(180deg, #7686ff, #5565f0); box-shadow: 0 0 14px rgba(107, 123, 255, .45); }
.b-btn.danger { color: #fff; border-color: transparent; background: linear-gradient(180deg, #ff7b7b, #e04848); }
.b-lock { display: inline-flex; align-items: center; gap: 6px; margin-left: 2px; padding: 4px 10px; border-radius: 8px; color: var(--dim); border: 1px dashed var(--line); }
.b-lock svg { width: 12px; height: 12px; }
.b-ban { padding: 6px 9px; border-radius: 8px; font-weight: 600; font-size: 12px; color: #ffdcae; background: rgba(255, 159, 67, .15); border: 1px solid rgba(255, 159, 67, .5); }
.b-ban.bad { color: #ffc4c4; background: rgba(255, 93, 93, .16); border-color: rgba(255, 93, 93, .5); }
.b-ban.good { color: #b6f5cf; background: rgba(46, 204, 113, .14); border-color: rgba(46, 204, 113, .5); }
.b-ban.info { color: #cfd6ff; background: rgba(107, 123, 255, .16); border-color: rgba(138, 152, 255, .5); }
.b-note { color: var(--dim); font-style: italic; font-size: 11.5px; padding: 0 2px; }
.b-note.warn { padding: 7px 8px; border: 1px dashed rgba(255, 159, 67, .45); border-radius: 8px; color: #ffcf9a; font-style: normal; text-align: center; }
.b-note.plain { color: #c3ccf2; font-style: normal; }
.b-ghosts { display: flex; flex-direction: column; gap: 5px; }
.b-ghosts div { padding: 6px 8px; border-radius: 6px; border: 1px dashed var(--line); color: var(--dim); font-size: 11.5px; }
.b-ghosts span { margin-top: 4px; color: #ffcf9a; font-size: 11.5px; text-align: center; }
.b-prog { padding: 7px 9px; border-radius: 8px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); color: var(--run); }
.b-prog.good { color: var(--good); border-color: rgba(46, 204, 113, .5); }
.b-prog.bad { color: var(--bad); border-color: rgba(255, 93, 93, .5); }
.b-dots { display: flex; gap: 3px; margin-bottom: 5px; }
.b-dots i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .1); }
.b-dots i.p { background: currentColor; opacity: .45; }
.b-dots i.n { background: currentColor; box-shadow: 0 0 8px currentColor; }
.b-st { display: flex; align-items: baseline; gap: 8px; }
.b-st b { font-family: var(--mono); font-size: 12px; flex: none; }
.b-st span { color: #c3ccf2; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-dlg { position: absolute; left: 12px; right: 12px; top: 22px; z-index: 2; padding: 10px 12px; border-radius: 10px; background: #141a3a; border: 1px solid rgba(138, 152, 255, .7);
  box-shadow: 0 12px 34px rgba(0, 0, 0, .7), 0 0 0 400px rgba(4, 6, 16, .6); animation: dlg .3s ease-out; }
@keyframes dlg { 0% { transform: translateY(8px) scale(.96); opacity: 0; } }
.b-dt { font-weight: 700; font-size: 13px; margin-bottom: 7px; }
.b-opt { display: flex; align-items: center; gap: 7px; padding: 4px 7px; border-radius: 7px; color: var(--mut); }
.b-opt i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--dim); flex: none; }
.b-opt em { margin-left: auto; font-style: normal; font-size: 10.5px; color: var(--dim); }
.b-opt.on { color: #fff; background: rgba(107, 123, 255, .2); font-weight: 600; }
.b-opt.on i { border-color: #9aa6ff; background: radial-gradient(#9aa6ff 45%, transparent 50%); }
.b-opt.on em { color: #8ff0b6; }
.b-dn { margin-top: 6px; font-size: 10.5px; color: var(--dim); }
.b-warn { padding: 6px 9px; border-radius: 8px; color: #ffdcae; background: rgba(255, 159, 67, .15); border: 1px solid rgba(255, 159, 67, .5); font-size: 12px; }
.b-opt + .b-warn { margin-top: 7px; }
.b-warn b, .b-ban b, .b-note b { color: #fff; }
.b-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 9px; }
.b-acts span { padding: 3px 12px; border-radius: 7px; border: 1px solid var(--line); color: var(--mut); font-weight: 600; }
.b-acts .go { color: #fff; border-color: transparent; background: linear-gradient(180deg, #ffab57, #f08a24); box-shadow: 0 0 14px rgba(255, 159, 67, .5); }

/* ---------- right side: the service in focus + what is on the wire ---------- */
#side { position: fixed; z-index: 5; top: 62px; right: 16px; bottom: 14px; width: var(--sidew); display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
#side > * { pointer-events: auto; }
#info { flex: 0 1 auto; min-height: 150px; display: flex; flex-direction: column; overflow: hidden; }
.ih { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 700; }
.ih .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); flex: none; }
.ih .ic svg { width: 16px; height: 16px; }
#info .mode { font-size: 10.5px; color: var(--dim); margin: 3px 0 7px 37px; }
#info .mode a { color: #9aa6ff; cursor: pointer; text-decoration: underline; }
.role { color: #cbd3f5; font-size: 12.5px; }
.chg { display: flex; align-items: baseline; gap: 7px; margin-top: 7px; font-size: 11.5px; color: var(--mut); }
.chg span { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; border: 1px solid; background: rgba(255, 255, 255, .05); }
.chg .no { color: var(--dim); border: 1px dashed var(--line); background: none; }
.sub { margin: 11px 0 6px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--mut); }
#info ol { list-style: none; margin: 0; padding: 0 4px 0 0; overflow: hidden auto; flex: 1 1 auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #2b3566 transparent; }
#info li { display: flex; gap: 9px; padding: 4px 7px; border-radius: 8px; color: #aab3d9; font-size: 12.5px; }
#info li b { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; color: var(--mut); background: rgba(255, 255, 255, .06); margin-top: 0; }
#info li.now { color: #fff; background: rgba(107, 123, 255, .18); box-shadow: inset 0 0 0 1px rgba(138, 152, 255, .45); animation: rowok 1.2s ease-out; }
#info li.now b { color: #fff; background: var(--acc); }
#info li.next { color: var(--dim); font-style: italic; }
#info .none { color: var(--dim); font-style: italic; }
#sidebot { flex: none; margin-top: auto; display: flex; flex-direction: column; gap: 9px; }
.wh { display: flex; align-items: baseline; gap: 8px; }
.proto { flex: none; font-size: 10px; font-weight: 800; letter-spacing: .8px; padding: 1px 7px; border-radius: 6px; color: #0a0e22; background: #aab6ff; }
.wh .head { font-family: var(--mono); font-size: 11.5px; color: #dfe5ff; word-break: break-all; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.tags span { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--mut); }
.tags span svg { width: 10px; height: 10px; }
.tags .sg { color: #ffd09c; border-color: rgba(255, 159, 67, .65); background: rgba(255, 159, 67, .12); }
.tags .ns { color: #ffb3b3; border-color: rgba(255, 93, 93, .65); background: rgba(255, 93, 93, .12); }
#wire pre { margin: 8px 0 0; padding: 8px 10px; border-radius: 9px; background: rgba(4, 6, 16, .72); border: 1px solid rgba(125, 140, 230, .16); font: 11px/1.5 var(--mono); color: #c3ccf2; white-space: pre-wrap; word-break: break-word; max-height: 190px; overflow: hidden auto; }
#wire pre .s { color: #9be7c0; } #wire pre .k { color: #c9a2ff; font-weight: 700; } #wire pre .c { color: #ffcf9a; }
#legend { flex: none; display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 0 4px; font-size: 11px; color: var(--mut); }
#legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
#legend i { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }

/* ---------- bottom: caption, states, timeline, controls ---------- */
#hud { position: fixed; z-index: 5; left: 24px; right: calc(var(--sidew) + 40px); bottom: 12px; display: flex; flex-direction: column; align-items: center; gap: 7px; pointer-events: none; text-align: center; }
#hud > * { pointer-events: auto; }
#capline { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 34px; max-width: 100%; }
#clock { font: 600 12.5px var(--mono); color: #b9c2ea; padding: 2px 9px; border-radius: 8px; border: 1px solid var(--line); background: rgba(12, 16, 36, .7); flex: none; }
#caption { font-size: 23px; font-weight: 700; letter-spacing: -.2px; text-shadow: 0 2px 18px rgba(0, 0, 0, .9); }
#caption.swap { animation: cap .45s ease-out; }
@keyframes cap { 0% { opacity: 0; transform: translateY(8px); filter: blur(3px); } }
#why { min-height: 20px; font-size: 13px; color: #b9c2ea; text-shadow: 0 1px 10px rgba(0, 0, 0, .9); max-width: 860px; }
#why b { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: #0a0e22; background: #9aa6ff; border-radius: 5px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
#why.outcome { font-weight: 600; color: #cfd6ff; }
#why.outcome.good { color: #8ff0b6; }
#why.outcome.bad { color: #ff9c9c; }
#why.outcome.warn { color: #ffcf9a; }
#chips { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 0; min-height: 26px; }
.chip { position: relative; font: 600 11.5px var(--mono); padding: 3px 10px; border-radius: 999px; color: var(--dim); border: 1px solid var(--line); background: rgba(12, 16, 36, .6); transition: .25s; }
.chip + .chip { margin-left: 18px; }
.chip + .chip::before { content: "›"; position: absolute; left: -13px; top: 1px; color: var(--dim); font-size: 13px; }
.chip.past { color: #aab3d9; border-color: rgba(125, 140, 230, .45); background: rgba(107, 123, 255, .14); }
.chip.now { color: #1a0e00; background: var(--run); border-color: var(--run); box-shadow: 0 0 18px rgba(255, 159, 67, .7); transform: scale(1.08); }
.chip.good.now { color: #06210f; background: #43e088; border-color: #43e088; box-shadow: 0 0 18px rgba(46, 204, 113, .7); }
.chip.bad.now { color: #2a0606; background: #ff7b7b; border-color: #ff7b7b; box-shadow: 0 0 18px rgba(255, 93, 93, .7); }
#ctl { display: flex; align-items: center; gap: 8px; width: min(100%, 880px); padding: 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
.cb { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #cfd6ff; flex: none; transition: .15s; }
.cb:hover { background: rgba(255, 255, 255, .1); color: #fff; }
.cb svg { width: 16px; height: 16px; fill: currentColor; stroke-width: 2; }
#play { width: 36px; height: 36px; color: #fff; background: linear-gradient(180deg, #7686ff, #5565f0); box-shadow: 0 0 16px rgba(107, 123, 255, .6); }
#play svg { width: 17px; height: 17px; }
#speed { flex: none; min-width: 34px; font: 700 12px var(--mono); color: var(--mut); padding: 4px 6px; border-radius: 8px; }
#speed:hover { color: #fff; background: rgba(255, 255, 255, .1); }
#tl { position: relative; flex: 1 1 auto; height: 30px; margin: 0 14px; }
#tl .track { position: absolute; left: 0; right: 0; top: 14px; height: 2px; border-radius: 2px; background: rgba(125, 140, 230, .25); }
#tl .fill { height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, #6b7bff, #2ee6d6); box-shadow: 0 0 10px rgba(46, 230, 214, .6); transition: width .45s ease; }
#tl .dots { position: absolute; left: 0; right: 0; top: 15px; }
.tdot { position: absolute; top: 0; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: #0c1024; border: 2px solid color-mix(in srgb, var(--c) 55%, #0c1024); transition: .2s; }
.tdot.done { background: color-mix(in srgb, var(--c) 75%, #0c1024); border-color: var(--c); }
.tdot.now { background: #fff; border-color: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 35%, transparent), 0 0 16px var(--c); transform: scale(1.25); }
.tdot:hover { transform: scale(1.45); }
.tdot::after { content: attr(data-tip); position: absolute; left: 50%; bottom: 17px; transform: translateX(-50%); padding: 3px 9px; border-radius: 7px; font: 500 11.5px var(--sans); white-space: nowrap; color: #fff;
  background: #1a2148; border: 1px solid rgba(138, 152, 255, .6); opacity: 0; pointer-events: none; transition: opacity .12s; }
.tdot:hover::after { opacity: 1; }
#count { flex: none; font: 600 12px var(--mono); color: var(--mut); min-width: 52px; text-align: right; }
#nextsc { display: none; flex: none; padding: 5px 13px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #7686ff, #5565f0); box-shadow: 0 0 16px rgba(107, 123, 255, .6); white-space: nowrap; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
#nextsc.show { display: block; }

/* ---------- sequence view ---------- */
#seq { position: fixed; z-index: 7; left: 16px; top: 62px; right: calc(var(--sidew) + 28px); bottom: 188px; display: flex; flex-direction: column; background: rgba(9, 12, 28, .95); }
.q-head { display: flex; flex: none; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.q-lane { flex: none; text-align: center; font-size: 10.5px; line-height: 1.15; font-weight: 700; color: #cfd6ff; overflow-wrap: anywhere; padding: 0 3px; }
.q-lane i { display: block; width: 8px; height: 8px; border-radius: 50%; margin: 0 auto 3px; background: var(--c); box-shadow: 0 0 8px var(--c); }
.q-body { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden auto; scrollbar-width: thin; scrollbar-color: #2b3566 transparent; }
.q-row { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(125, 140, 230, .1); cursor: pointer; transition: opacity .2s; }
.q-row:hover { background: rgba(255, 255, 255, .04); }
.q-row.now { background: rgba(107, 123, 255, .16); box-shadow: inset 3px 0 0 var(--acc); }
.q-row.future { opacity: .4; }
.q-n { flex: none; width: 20px; height: 20px; margin-left: 6px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: var(--mut); background: rgba(255, 255, 255, .07); }
.q-row.now .q-n { color: #fff; background: var(--acc); }
.q-c { flex: none; font-size: 12px; line-height: 1.25; color: #dfe5ff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.q-t { flex: none; width: 56px; font: 10.5px var(--mono); color: var(--dim); }
.q-svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.q-svg text { font: 600 10.5px var(--sans); stroke: none; paint-order: stroke; stroke: #090c1c; stroke-width: 3px; }
.q-svg line, .q-svg path, .q-svg circle { stroke-linecap: round; }
.q-g { transition: opacity .2s; }
.q-g.future { opacity: .28; }
.q-g.now { filter: drop-shadow(0 0 5px rgba(255, 255, 255, .55)); }

/* ---------- help, errors ---------- */
#help { position: fixed; z-index: 9; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 380px; padding: 16px 18px; background: rgba(12, 16, 36, .96); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; font-size: 12.5px; color: #cbd3f5; }
#help { max-height: 86vh; overflow: hidden auto; }
#help .open { margin: 0; padding-left: 18px; font-size: 12.5px; color: #ffdcae; }
#help .open li + li { margin-top: 4px; }
kbd { font: 600 11px var(--mono); padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); border-bottom-width: 2px; background: rgba(255, 255, 255, .06); color: #fff; white-space: nowrap; justify-self: start; }
#err { display: none; position: fixed; z-index: 10; left: 16px; bottom: 16px; max-width: 60vw; padding: 10px 14px; border-radius: 10px; background: #3a0d12; border: 1px solid #ff5d5d; color: #ffd0d0; font: 12px var(--mono); white-space: pre-wrap; }

/* ---------- smaller windows ---------- */
@media (max-width: 1500px) { :root { --sidew: 340px; --lensw: 292px; } #caption { font-size: 20px; } }
@media (max-width: 1100px) { #side { display: none; } #hud { right: 24px; } #seq { right: 16px; } #lens1 { display: none !important; } }
@media (max-height: 860px) { .lens { transform: scale(.85); transform-origin: top left; } #lens1 { left: calc(16px + var(--lensw) * .85 + 10px); } }
